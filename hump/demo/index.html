const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.iv)},key,b64(DATA.ct));
  return new TextDecoder().decode(pt);
}
async function tryPw(pw){
  try{const html=await unlock(pw);try{sessionStorage.setItem('hump_pw',pw);}catch(e){}
    document.open();document.write(html);document.close();return true;}
  catch(e){return false;}
}
document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();
  const ok=await tryPw(document.getElementById('pw').value);
  if(!ok)document.getElementById('msg').textContent='パスワードが違います。';});
(async()=>{let pw=null;try{pw=sessionStorage.getItem('hump_pw');}catch(e){} if(pw)await tryPw(pw);})();
